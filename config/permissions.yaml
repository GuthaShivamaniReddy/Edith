# Tool -> permission tier map (PLAN.md section 7). Enforced by edith/safety/policy.py from Phase 1.
#   0 = read (runs, logged)      1 = reversible (runs, logged, undo offered)
#   2 = consequential (asks)     3 = forbidden (refused)
# Changes to this file need the user's explicit approval (CLAUDE.md hard rules).
default_tier: 2               # anything unlisted asks first
tools:
  web.search: 0
  files.read: 0
  calendar.list_events: 0
  system.stats: 0
  system.set_volume: 1
  apps.open: 1
  notes.create: 1
  music.play: 1
  calendar.create_event: 2
  email.send: 2
  files.trash: 2
  shell.run: 2
  browser.submit_form: 2
  home.unlock_door: 2
  payments.*: 3
  security.*: 3
