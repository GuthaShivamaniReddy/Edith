# EDITH main configuration. No secrets here - they live in the OS keychain.
user:
  name: "Shivamani"
  address: "sir"              # what EDITH calls you
  timezone: "America/New_York"
  city: ""                    # optional; used in the system prompt context

models:
  main: claude-sonnet-5-5     # tasks and, in Phase 0, all chat
  fast: claude-haiku-5-5      # routing, summaries (Phase 1+)
  deep: claude-opus-5-5       # deep research (Phase 6)
  local: gemma4:12b           # via Ollama (Phase 6)
  effort: medium              # low | medium | high | xhigh | max; lower = faster, cheaper chat

agent:
  max_turns: 25               # agent-loop turn limit per request

budgets:
  per_request_usd: 0.50       # enforced by the orchestrator from Phase 1
  per_day_usd: 3.00           # enforced from Phase 0: chat refuses new turns past this

voice:                        # Phase 3
  wake_word: hey_edith
  stt_model: small
  tts: kokoro
  tts_voice: bf_emma          # British female; bm_george for male
  follow_up_seconds: 8

files:
  # Folders EDITH may ASK to read. Nothing is readable until you approve it in a prompt
  # ("once" or "for this session"); every new session starts with no access.
  allowed_roots: ["~/Documents", "~/Downloads", "~/Desktop"]
  # Folders EDITH can never read, list or trash, even if you approve. Put work folders here.
  blocked_roots: []

# Apps EDITH can open, by name. It cannot launch anything not listed here.
apps:
  notepad: notepad.exe
  calculator: calc.exe
  paint: mspaint.exe
  explorer: explorer.exe
  task manager: taskmgr.exe
  settings: "ms-settings:"

server:
  host: 127.0.0.1             # the API never listens beyond this computer
  port: 8765

safety:
  confirm_timeout_s: 120      # unanswered confirmations are refused

privacy:
  disable_cli_telemetry: true # no Claude Code telemetry / error reports from EDITH

quiet_hours: ["23:00", "07:00"]

paths:
  data_dir: "~/.edith"        # logs, costs; later memory and audit log
