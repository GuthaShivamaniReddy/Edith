[project]
name = "edith"
version = "0.0.1"
description = "EDITH - a personal AI assistant that runs on your own computer."
readme = "README.md"
requires-python = ">=3.12,<3.13"
# Direct dependencies are pinned exactly (PLAN.md section 4: the Agent SDK is v0.x and
# ships weekly). Upgrade on purpose, one dependency at a time, with tests green.
dependencies = [
    "claude-agent-sdk==0.2.180",
    "comtypes==1.5.0 ; sys_platform == 'win32'",
    "fastapi==0.162.4",
    "keyring==25.7.0",
    "mss==10.2.0",
    "psutil==7.2.2",
    "pycaw==20260927 ; sys_platform == 'win32'",
    "pydantic==2.14.3",
    "pyperclip==1.11.0",
    "pyyaml==6.0.3",
    "rich==15.0.0",
    "send2trash==2.1.0",
    "structlog==26.1.0",
    "typer==0.29.0",
    "tzdata==2026.1",
    "uvicorn==0.54.0",
    "websockets==17.4",
]

[project.scripts]
edith = "edith.interfaces.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["edith"]

[dependency-groups]
dev = [
    "httpx==0.28.1",
    "mypy==2.4.1",
    "pytest==9.2.0",
    "pytest-asyncio==1.4.1.post1",
    "ruff==0.17.4",
    "types-psutil==7.2.2.20260906",
    "types-pyyaml==6.0.12.20261103",
]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "ASYNC", "RUF", "S"]
ignore = []

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S101", "S105", "S106"]

[tool.mypy]
python_version = "3.12"
strict = true
files = ["edith", "tests"]

[[tool.mypy.overrides]]
# Untyped third-party libraries (pycaw/comtypes exist only on Windows).
module = ["pyperclip", "send2trash", "pycaw.*", "comtypes", "mss", "mss.*"]
ignore_missing_imports = true

[[tool.mypy.overrides]]
# Windows-only APIs: type-checks differ by platform, so allow both outcomes.
module = ["edith.tools.system.windows"]
disallow_untyped_calls = false
warn_unused_ignores = false

[tool.pyright]
venvPath = "."
venv = ".venv"

[tool.pytest.ini_options]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
addopts = "-q"
